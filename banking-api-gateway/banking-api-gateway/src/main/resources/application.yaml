
server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/accounts,/accounts/**
          filters:
            - RewritePath=/accounts/?(?<segment>.*), /api/v1/internal/accounts/$\{segment}
